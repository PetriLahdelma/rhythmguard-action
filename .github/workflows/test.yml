name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, against the newest 3.x on npm: a release that breaks the action shows
  # here within a day (3.16.0 to 3.18.0 broke it for two weeks, unnoticed).
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read
  pull-requests: write

jobs:
  passes-against-its-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: audit
        uses: ./
        with:
          directory: examples/clean/src
          baseline: examples/clean/.rhythmguard-baseline.json
          badge: examples/out/badge.json
      - name: Check outputs
        run: |
          test "${{ steps.audit.outputs.findings }}" = "3"
          test "${{ steps.audit.outputs.new-findings }}" = "0"
          test "${{ steps.audit.outputs.scale-source }}" = "scanned-css"
          test "${{ steps.audit.outputs.scale }}" = "0,4,8,12,16,24"
          grep -q '"label": "spacing drift"' examples/out/badge.json

  fails-on-new-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: audit
        continue-on-error: true
        uses: ./
        with:
          directory: examples/drifted/src
          baseline: examples/drifted/.rhythmguard-baseline.json
          comment: "false"
      - name: The step must have failed with the two findings of one new value
        run: |
          test "${{ steps.audit.outcome }}" = "failure"
          test "${{ steps.audit.outputs.new-findings }}" = "2"

  fails-when-a-required-baseline-is-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: audit
        continue-on-error: true
        uses: ./
        with:
          directory: examples/clean/src
          baseline: examples/clean/no-such-baseline.json
          require-baseline: "true"
          comment: "false"
      - name: The step must have failed before auditing
        run: |
          test "${{ steps.audit.outcome }}" = "failure"
          test -z "${{ steps.audit.outputs.findings }}"
